name: Daily GLaDOS check-in

on:
  workflow_dispatch:
  schedule:
    # 09:18 Beijing time; GitHub may delay scheduled jobs.
    - cron: '18 1 * * *'

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  build:
    name: GLaDOS check-in
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check result handling
        run: python -m unittest discover -s tests -v
      - name: Run check-in
        run: python checkin.py
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_EXCHANGE_PLAN: 'none'
          GLADOS_VERBOSE: 'false'
      - name: Keep schedule active
        if: ${{ always() }}
        uses: liskin/gh-workflow-keepalive@v1
