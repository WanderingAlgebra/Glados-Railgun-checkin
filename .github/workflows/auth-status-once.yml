name: GLaDOS auth status once

on:
  push:
    branches: ['codex/auth-status-20261027']
    paths: ['.github/workflows/auth-status-once.yml']

permissions: {}

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Install status client
        run: python3 -m pip install requests==2.32.5
      - name: Read status once without check-in
        shell: bash
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_USER_AGENT: ''
        run: |
          python3 - <<'PY'
          """One status GET using an existing environment credential; run only after approval.
          
          No import of checkin, no POST, redirects, retries, notifications or cookie storage.
          Output is an allowlist of booleans, numbers and fixed categories, never raw strings.
          """
          import json
          import os
          from urllib.parse import urljoin, urlsplit
          
          import requests
          from requests.adapters import HTTPAdapter
          
          
          URL = "https://glados.rocks/api/user/status"
          DEFAULT_UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          
          
          def probe():
              cookies = [c.strip() for c in os.environ.get("GLADOS_COOKIES", "").split("&") if c.strip()]
              ua = os.environ.get("GLADOS_USER_AGENT", "")
              if len(cookies) != 1 or "\r" in ua or "\n" in ua:
                  return {"error": "expected_one_account_and_single_line_ua"}
              names = {part.partition("=")[0].strip() for part in cookies[0].split(";")}
              summary = {
                  "gld_session_present": "gld:sess" in names,
                  "gld_signature_present": "gld:sess.sig" in names,
                  "custom_ua": bool(ua.strip()),
              }
              try:
                  with requests.Session() as session:
                      session.mount("https://", HTTPAdapter(max_retries=0))
                      with session.get(URL, headers={
                          "origin": "https://glados.rocks",
                          "user-agent": ua.strip() or DEFAULT_UA,
                          "cookie": cookies[0],
                      }, timeout=(10, 20), allow_redirects=False, stream=True) as response:
                          summary["http_status"] = response.status_code
                          summary["redirect"] = response.is_redirect
                          location = response.headers.get("Location")
                          summary["redirect_target"] = "none"
                          if location:
                              target = urlsplit(urljoin(URL, location))
                              summary["redirect_target"] = "same_origin" if (target.scheme, target.netloc) == ("https", "glados.rocks") else "other_origin"
                          summary["sets_gld_session"] = any(c.name == "gld:sess" for c in response.cookies)
                          summary["sets_gld_signature"] = any(c.name == "gld:sess.sig" for c in response.cookies)
                          body = response.raw.read(65537, decode_content=True)
                          if len(body) > 65536:
                              summary["body_kind"] = "over_limit"
                              return summary
                          try:
                              data = json.loads(body)
                          except (ValueError, UnicodeError):
                              summary["body_kind"] = "non_json"
                              return summary
                          summary["body_kind"] = "json_object" if isinstance(data, dict) else "other_json"
                          if not isinstance(data, dict):
                              return summary
                          summary["code_present"] = "code" in data
                          code = data.get("code")
                          summary["code"] = code if type(code) is int and -1000 <= code <= 1000 else None
                          account = data.get("data")
                          days = account.get("leftDays") if isinstance(account, dict) else None
                          summary["left_days_present"] = days is not None
                          summary["status_authenticated"] = response.status_code == 200 and type(code) is int and code == 0 and days is not None
                          message = data.get("message")
                          summary["message_category"] = "permission" if message in ("没有权限", "No permission") else "other"
                          summary["device_mismatch"] = data.get("reason") == "device-mismatch"
              except Exception:
                  # Exceptions can contain request headers or server text; never stringify them.
                  summary["error"] = "request_or_response_error"
              return summary
          
          
          def main():
              result = probe()
              print(json.dumps(result, sort_keys=True))
              return 0 if result.get("status_authenticated") else 1
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          PY
